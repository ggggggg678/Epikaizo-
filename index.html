<!DOCTYPE html>
<html lang="fr">
<head><link rel="stylesheet" href="devis.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Epikaizo - Enregistrement public</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>Epikaizo</h1>
    <p>Enregistrement de présence</p>
  </div>
  <div class="form-body">
    <div class="form-group">
      <label>Nom *</label>
      <input type="text" id="nom" placeholder="Votre nom">
    </div>
    <div class="form-group">
      <label>Prénom *</label>
      <input type="text" id="prenom" placeholder="Votre prénom">
    </div>
    <div class="form-group">
      <label>Lieu / Quartier</label>
      <input type="text" id="lieu" placeholder="Optionnel">
    </div>
    <div class="form-group">
      <label>Contact (email ou tél)</label>
      <input type="text" id="contact" placeholder="Optionnel">
    </div>
    <div class="form-group">
      <label>Statut</label>
      <select id="statut">
        <option value="member">Membre de Epikaizo</option>
        <option value="visitor">Visiteur (autre église)</option>
      </select>
    </div>
    <div class="form-group" id="visitorGroup" style="display:none;">
      <label>Nom de votre église</label>
      <input type="text" id="eglise" placeholder="Nom de l'église">
    </div>
    <button id="btnEnregistrer">Enregistrer ma présence ✨</button>
    <footer>Vos données sont confidentielles.</footer>
  </div>
</div>
<div id="toast" class="toast">✅ Enregistrement réussi</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBKycoZ7BETwGZdWfecSdE-LhW6S2QteTs",
    authDomain: "church-epikaizo.firebaseapp.com",
    databaseURL: "https://church-epikaizo-default-rtdb.firebaseio.com",
    projectId: "church-epikaizo",
    storageBucket: "church-epikaizo.firebasestorage.app",
    messagingSenderId: "31324831614",
    appId: "1:31324831614:web:1f02294643389f5b6f7d2f",
    measurementId: "G-VZHBPQWZ3V"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  document.getElementById('statut').addEventListener('change', function(e) {
    const visitorDiv = document.getElementById('visitorGroup');
    visitorDiv.style.display = e.target.value === 'visitor' ? 'block' : 'none';
  });

  function showToast(msg, type = 'success') {
    const toastEl = document.getElementById('toast');
    toastEl.textContent = msg;
    toastEl.classList.remove('error-toast');
    if (type === 'error') {
      toastEl.classList.add('error-toast');
    } else {
      toastEl.style.background = '#226622';
      toastEl.style.borderLeftColor = '#F9E45B';
      toastEl.style.color = '#FFFBE6';
    }
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 3200);
  }

  document.getElementById('btnEnregistrer').onclick = async () => {
    const nom = document.getElementById('nom').value.trim();
    const prenom = document.getElementById('prenom').value.trim();
    if (!nom || !prenom) {
      showToast('⚠️ Nom et prénom sont requis', 'error');
      return;
    }

    const statut = document.getElementById('statut').value;
    const isMember = (statut === 'member');
    let churchName = null;
    if (!isMember) {
      churchName = document.getElementById('eglise').value.trim();
      if (churchName === '') churchName = 'Non spécifiée';
    }

    const data = {
      nom: nom,
      prenom: prenom,
      lieu: document.getElementById('lieu').value.trim() || '',
      contact: document.getElementById('contact').value.trim() || '',
      is_member: isMember,
      church_name: isMember ? null : churchName,
      date: new Date().toISOString(),
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    const btn = document.getElementById('btnEnregistrer');
    btn.disabled = true;
    btn.textContent = '⏳ Envoi en cours...';

    try {
      await db.collection('presences').add(data);
      showToast(`✅ ${prenom} ${nom} inscrit(e) avec succès !`);
      document.getElementById('nom').value = '';
      document.getElementById('prenom').value = '';
      document.getElementById('lieu').value = '';
      document.getElementById('contact').value = '';
      document.getElementById('eglise').value = '';
      document.getElementById('statut').value = 'member';
      document.getElementById('visitorGroup').style.display = 'none';
    } catch (error) {
      console.error("Firestore error:", error);
      showToast('❌ Erreur de connexion ou d’enregistrement', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '🐣 Enregistrer ma présence ✨';
    }
  };
</script>
</body>
</html>
